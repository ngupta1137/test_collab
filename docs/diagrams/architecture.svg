<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" role="img" aria-label="Deterministic where it must be, models only where they help"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F6B64"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4E8416"/></marker></defs><rect width="1920" height="1080" fill="#FFFFFF"/><text x="80" y="84" font-size="44" font-weight="700" fill="#1F2A24" text-anchor="start">Deterministic where it must be, models only where they help</text><text x="80" y="124" font-size="22" font-weight="400" fill="#5F6B64" text-anchor="start">One enforcement layer for people and agents. Models sit at four steps; everything that decides what counts as evidence is deterministic.</text><text x="80" y="178" font-size="16" font-weight="700" fill="#5F6B64" text-anchor="start">CHANNELS AND AGENTS</text><rect x="80.0" y="192" width="325.0" height="78" rx="14" fill="#F5F7F4" stroke="#DDE3DA" stroke-width="1.5"/><text x="242.5" y="226" font-size="21" font-weight="700" fill="#1F2A24" text-anchor="middle">Advocate desktop</text><text x="242.5" y="254" font-size="17" font-weight="400" fill="#5F6B64" text-anchor="middle">typed or spoken query</text><rect x="425.0" y="192" width="325.0" height="78" rx="14" fill="#F5F7F4" stroke="#DDE3DA" stroke-width="1.5"/><text x="587.5" y="226" font-size="21" font-weight="700" fill="#1F2A24" text-anchor="middle">Member chat</text><text x="587.5" y="254" font-size="17" font-weight="400" fill="#5F6B64" text-anchor="middle">self-service</text><rect x="770.0" y="192" width="325.0" height="78" rx="14" fill="#F5F7F4" stroke="#DDE3DA" stroke-width="1.5"/><text x="932.5" y="226" font-size="21" font-weight="700" fill="#1F2A24" text-