FF" text-anchor="middle">P</text><text x="94.0" y="594" font-size="20" font-weight="700" fill="#1F2A24" text-anchor="start">Understand query</text><text x="94.0" y="620" font-size="16" font-weight="400" fill="#5F6B64" text-anchor="start">lexicon, speech errors,</text><text x="94.0" y="641" font-size="16" font-weight="400" fill="#5F6B64" text-anchor="start">split parts</text><line x1="296.0" y1="588" x2="308.0" y2="588" stroke="#5F6B64" stroke-width="1.5" marker-end="url(#arr)"/><rect x="309.0" y="522" width="215.0" height="132" rx="14" fill="#FFFFFF" stroke="#DDE3DA" stroke-width="1.5"/><rect x="323.0" y="536" width="26" height="28" rx="14.0" fill="#1F2A24"/><text x="336.0" y="553" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text><text x="323.0" y="594" font-size="20" font-weight="700" fill="#1F2A24" text-anchor="start">Search two indexes</text><text x="323.0" y="620" font-size="16" font-weight="400" fill="#5F6B64" text-anchor="start">body: entitlement filter</text><text x="323.0" y="641" font-size="16" font-weight="400" fill="#5F6B64" text-anchor="start">in query; routing: title</text><line x1="525.0" y1="588" x2="537.0" y2="588" stroke="#5F6B64" stroke-width="1.5" marker-end="url(#arr)"/><rect x="538.0" y="522" width="215.0" height="132" rx="14" fill="#FFFFFF" stroke="#DDE3DA" stroke-width="1.5"/><rect x="552.0" y="536" width="26" height="28" rx="14.0" fill="#1F2A24"/><text x="565.0" y="553" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text><text x="552.0" y="594" font-size="20" font-weight="700" fill="#1F2A24" text-anchor="start">Eligible + applicable</text><text x="552.0" y="620" font-size="16" font-weight="400" fill="#5F6B64" text-anchor="start">dates, LOB, state, plan</text><text x="552.0" y="641" font-size="16" font-weight="400" fill="#5F6B64" text-anchor="start">year, channel</text><line x1="754.0" y1="588" x2="766.0" y2="588" stroke="#5F6B64" stroke-width="1.5" marker-end="url(#arr)"/><rect x="767.0" y=